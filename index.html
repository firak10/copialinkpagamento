<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Pix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h2 { font-size: 20px; color: #1c1e21; margin-bottom: 8px; }
    p { font-size: 14px; color: #606770; margin-bottom: 20px; line-height: 1.4; }
    .btn-copiar {
      background-color: #00a884;
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-copiar:active { background-color: #008f70; }
    .status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
      color: #00a884;
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">⚡</div>
  <h2>Pagamento via Pix</h2>
  <p>Toque no botão abaixo para copiar o código e pagar no aplicativo do seu banco.</p>

  <button class="btn-copiar" id="btnCopiar" onclick="copiarPix()">Copiar Código Pix</button>
  <div class="status" id="statusMsg">✓ Copiado! Abra o app do seu banco.</div>
</div>

<script>
  // Lê a chave tanto se for via '?' (window.location.search) quanto via '/' (window.location.pathname)
  let rawData = window.location.search ? window.location.search.substring(1) : window.location.pathname.replace('/copialinkpagamento/', '');
  const payloadPix = decodeURIComponent(rawData);

  function copiarPix() {
    if (!payloadPix) {
      alert("Nenhum código Pix encontrado na URL.");
      return;
    }

    navigator.clipboard.writeText(payloadPix).then(() => {
      const btn = document.getElementById('btnCopiar');
      const status = document.getElementById('statusMsg');
      
      btn.innerText = "Código Copiado!";
      btn.style.backgroundColor = "#424242";
      status.style.display = "block";
    }).catch(err => {
      alert("Erro ao copiar. Tente selecionar o texto manualmente.");
    });
  }
</script>

</body>
</html>
